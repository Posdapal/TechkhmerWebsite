<title>TechKhmer – ព័ត៌មានបច្ចេកវិទ្យា</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#0E131C;--card:#161D2A;--ink:#EDF1F8;--muted:#9AA7BD;--line:#263044;--accent:#7DA7FF;--accent-ink:#0E131C;--soft:#1F2A42;--shadow:0 8px 24px -12px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.75 'Noto Sans Khmer',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}

.logo{font-weight:800;font-size:1.25rem}
.logo b{color:var(--accent)}
.search{flex:1;max-width:420px;margin-left:auto}
.search input{width:100%;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card)}
.hero{padding:32px 0 8px}
.hero h1{font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.4;margin:0 0 6px;font-weight:800}
.hero p{color:var(--muted);margin:0}
.cats{display:flex;gap:8px;flex-wrap:wrap;padding:20px 0}
.cat{padding:6px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500}
.cat[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.thumb{display:grid;place-items:center;font-size:3rem}
.feature{display:grid;grid-template-columns:1.2fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}

.feature h2{font-size:1.6rem;line-height:1.5;margin:8px 0}
.tag{display:inline-block;font-size:.8rem;font-weight:700;color:var(--accent);background:var(--soft);padding:2px 12px;border-radius:999px}
.meta{color:var(--muted);font-size:.88rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:28px 0 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-4px)}
.card .thumb{height:130px}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:1.05rem;line-height:1.6}
.card p{margin:0;color:var(--muted);font-size:.93rem}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.save{border:0;background:none;font-size:1.2rem;padding:2px 6px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
dialog{width:min(680px,92vw);border:0;border-radius:22px;padding:0;background:var(--card);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,14,24,.55)}
dialog .thumb{height:180px;font-size:4.5rem}
dialog .in{padding:24px 28px 28px}
dialog h2{margin:8px 0;line-height:1.5}
dialog .close{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow)}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:.9rem;text-align:center}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}

const CATS=["ទាំងអស់","AI","ទូរសព្ទ","សុវត្ថិភាព","ស្ដាតអាប់","កម្មវិធី"];
let cat="ទាំងអស់",query="";
let saved=new Set();
try{saved=new Set(JSON.parse(localStorage.getItem("saved")||"[]"))}catch(e){}
const $=id=>document.getElementById(id);

function persist(){try{localStorage.setItem("saved",JSON.stringify([...saved]))}catch(e){}}

function renderCats(){
  $("cats").innerHTML="";
  CATS.concat(["★ ដែលបានរក្សាទុក"]).forEach(c=>{
    const b=document.createElement("button");
    b.className="cat";b.textContent=c;b.setAttribute("aria-pressed",c===cat);
    b.onclick=()=>{cat=c;renderCats();render()};
    $("cats").appendChild(b);
  });
}
function mkThumb(a,cls){const d=document.createElement("div");d.className="thumb "+(cls||"");d.style.background=a.bg;d.textContent=a.emoji;return d}

function render(){
  const q=query.trim().toLowerCase();
  const list=ARTICLES.filter(a=>
    (cat==="ទាំងអស់"||(cat.startsWith("★")?saved.has(a.id):a.cat===cat)) &&
    (!q||(a.title+a.sum).toLowerCase().includes(q)));
  const f=$("featured"),g=$("grid");
  f.innerHTML="";g.innerHTML="";
  if(!list.length){g.innerHTML='<p class="empty">រកមិនឃើញព័ត៌មានទេ។</p>';return}
  const showFeature=cat==="ទាំងអស់"&&!q;
  const rest=showFeature?list.slice(1):list;
  if(showFeature){
    const a=list[0],el=document.createElement("article");
    el.className="feature";el.tabIndex=0;
    el.appendChild(mkThumb(a));
    const t=document.createElement("div");t.className="txt";
    t.innerHTML='<span class="tag"></span><h2></h2><p class="meta"></p><p></p>';
    t.querySelector(".tag").textContent=a.cat;
    t.querySelector("h2").textContent=a.title;
    t.querySelector(".meta").textContent=a.time;
    t.lastChild.textContent=a.sum;
    el.appendChild(t);
    el.onclick=()=>openArticle(a);
    el.onkeydown=e=>{if(e.key==="Enter")openArticle(a)};
    f.appendChild(el);
  }
  rest.forEach(a=>{
    const c=document.createElement("article");c.className="card";c.tabIndex=0;
    c.appendChild(mkThumb(a));
    const b=document.createElement("div");b.className="body";
    b.innerHTML='<span class="tag" style="align-self:flex-start"></span><h3></h3><p></p><div class="row"><span class="meta"></span><button class="save"></button></div>';
    b.querySelector(".tag").textContent=a.cat;
    b.querySelector("h3").textContent=a.title;
    b.querySelector("p").textContent=a.sum;
    b.querySelector(".meta").textContent=a.time;
    const s=b.querySelector(".save");
    s.textContent=saved.has(a.id)?"★":"☆";
    s.setAttribute("aria-label","រក្សាទុក");
    s.onclick=e=>{e.stopPropagation();saved.has(a.id)?saved.delete(a.id):saved.add(a.id);persist();render()};
    c.appendChild(b);
    c.onclick=()=>openArticle(a);
    c.onkeydown=e=>{if(e.key==="Enter")openArticle(a)};
    g.appendChild(c);
  });
}
function openArticle(a){
  const t=$("dthumb");t.style.background=a.bg;t.textContent=a.emoji;
  $("dcat").textContent=a.cat;$("dtitle").textContent=a.title;
  $("dmeta").textContent=a.time;$("dbody").textContent=a.body;
  $("dlg").showModal();
}
$("dclose").onclick=()=>$("dlg").close();
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close()});
$("q").addEventListener("input",e=>{query=e.target.value;render()});

// ពណ៌ងងឹត/ភ្លឺ
function setTheme(t){document.documentElement.dataset.theme=t;$("theme").textContent=t==="dark"?"☀️":"🌙";try{localStorage.setItem("theme",t)}catch(e){}}
let th=null;try{th=localStorage.getItem("theme")}catch(e){}
setTheme(th||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
$("theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");

renderCats();render();
</script>
</body>
</html>
